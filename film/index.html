<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serious Play Motion Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#F3F2EE;--bone:#E6E1D6;--concrete:#BEBDB8;--ink:#0E0E0E;--graphite:#5E5D59;--cobalt:#2B3BF2;--aub:#1F0B33;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0B0B0B;overflow:hidden}
#stage{position:fixed;left:50%;top:50%;overflow:hidden;background:var(--paper);transform-origin:0 0;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.serif{font-family:"Instrument Serif","Times New Roman",serif;font-weight:400}
.cond{font-family:"Archivo","Arial Narrow",sans-serif;font-weight:800;font-stretch:62%;font-variation-settings:"wdth" 62;text-transform:uppercase;line-height:.8;white-space:nowrap}
.card{overflow:hidden;background:var(--bone);box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08)}
.scene{position:absolute;inset:0;display:none}
#grain{position:absolute;left:0;top:0;pointer-events:none;opacity:.045;mix-blend-mode:multiply;z-index:50}
#hud{position:absolute;inset:0;z-index:40;pointer-events:none}
#hud div{position:absolute}
.frame{background:#fff;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.8)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
#play{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:rgba(11,11,11,.72);color:#F3F2EE;border:0;cursor:pointer;font:500 13px/1.4 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;width:100%}
#play span{display:grid;gap:14px;justify-items:center}
#play b{font:italic 400 64px/1 "Instrument Serif",serif;letter-spacing:0;text-transform:none}
#play:focus-visible{outline:2px solid #2B3BF2;outline-offset:-6px}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Serious Play website direction, a 72 second motion pitch">
  <canvas id="grain"></canvas>
  <div class="scene" id="s1"></div>
  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4"></div>
  <div class="scene" id="s5"></div>
  <div class="scene" id="s6"></div>
  <div class="scene" id="s7"></div>
  <div id="hud"><div class="mono" id="hudL">Serious Play</div><div class="mono" id="hudR"></div><div class="mono" id="hudB"></div></div>
</div>
<button type="button" id="play" hidden><span><b>Serious Play</b>Play the film · 72 s · sound on</span></button>
<audio id="score" src="assets/score.m4a" preload="auto"></audio>

<script>
(function () {

  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  var refs = ["arc-records.jpg", "wgt-editorial.png", "circular-type.jpg", "eyes-wide-open.webp", "still-life-shell.jpg", "monnt-work.jpg", "ring-binder-lookbook.jpg", "workshop-canela.webp", "crudo.jpg", "sauvage-artists.jpg", "circa-ring.jpg", "recap-archive.jpg"];

  (function () { var x = g.getContext("2d"), d = x.createImageData(g.width, g.height); for (var i = 0; i < d.data.length; i += 4) { var v = rnd(i) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); g.style.width = g.width + "px"; g.style.height = g.height + "px"; })();

  /* ---------- HUD ---------- */

  /* ---------- S1 cold open ---------- */

  var tapes = ["Type is material", "Work is handled", "One colour at a time"].map(function (t) { var e = el("div", "cond abs", s3wrap, t); e.style.fontSize = M * .075 + "px"; e.style.background = "#fff"; e.style.padding = M * .012 + "px " + M * .03 + "px " + M * .006 + "px"; e.style.boxShadow = "0 10px 30px -12px rgba(0,0,0,.5)"; return e; });

  var spA = el("div", "cond abs", s4, "Archive"); spA.style.fontSize = M * (V ? .24 : .3) + "px";
  var spR = el("div", "serif abs", s4, "<i>Records</i>"); spR.style.fontSize = M * .2 + "px"; spR.style.lineHeight = "1";
  var spT = el("div", "mono abs", s4); spT.style.fontSize = M * .07 + "px"; spT.style.letterSpacing = "-.01em";
  var s4lab = el("div", "mono abs", s4, "[02] The system — one colour at a time"); s4lab.style.fontSize = Math.round(M * .016) + "px";
  var wipe = el("div", "abs", s4); wipe.style.width = W + "px"; wipe.style.height = H + "px"; wipe.style.background = C.cobalt;
  var wipeT = el("div", "cond abs", wipe, "Show, don’t tell"); wipeT.style.fontSize = M * .16 + "px"; wipeT.style.color = C.paper;

  /* ---------- S5 the ring ---------- */

  var pw = V ? W * .48 : H * .38, R5 = Math.max(W * .95, H * .9), step5 = pw * 1.22 / R5, cx5 = W / 2, cy5 = H * .42 + R5;
  var ringGuide = el("div", "abs", s5); ringGuide.style.width = ringGuide.style.height = R5 * 2 + "px"; ringGuide.style.border = "1px solid #D2D0CA"; ringGuide.style.borderRadius = "50%";

  var capN = el("div", "serif abs", s5); capN.style.zIndex = 150; capN.style.fontSize = M * .07 + "px"; capN.style.lineHeight = "1";
  var capF = el("div", "mono abs", s5); capF.style.zIndex = 150; capF.style.fontSize = Math.round(M * .014) + "px"; capF.style.color = C.graphite;
  var cnt = el("div", "serif abs", s5); cnt.style.zIndex = 150; cnt.style.fontSize = M * .05 + "px";
  var s5lab = el("div", "mono abs", s5, "[03] The ring — drag, scroll, settle"); s5lab.style.fontSize = Math.round(M * .016) + "px";
  // case study overlay
  var cs = el("div", "abs", s5); cs.style.width = W + "px"; cs.style.height = H + "px"; cs.style.overflow = "hidden"; cs.style.zIndex = 200;
  var csHero = el("div", "abs", cs); csHero.style.width = W + "px"; csHero.style.height = H + "px"; csHero.style.overflow = "hidden";
  var csImg = el("img", "", csHero); csImg.src = "assets/" + refs[0]; csImg.style.width = "100%"; csImg.style.height = "100%"; csImg.style.objectFit = "cover"; csImg.alt = "";
  var csTitle = el("div", "serif abs", cs, "Project<br>N°014"); csTitle.style.fontSize = M * .15 + "px"; csTitle.style.color = C.ink; csTitle.style.lineHeight = ".9";
  var csBody = el("div", "abs", cs); csBody.style.width = W + "px"; csBody.style.background = C.paper; csBody.style.padding = M * .04 + "px";
  var fs = Math.round(M * .014), fv = Math.round(M * .026);
  csBody.innerHTML = '<div style="display:grid;grid-template-columns:repeat(' + (V ? 2 : 4) + ',1fr);gap:' + M * .03 + 'px;padding-bottom:' + M * .03 + 'px;border-bottom:1.5px solid #0E0E0E">' +
    ["Client|[Client]", "Sector|[Sector]", "Discipline|[Identity, Packaging]", "Finding|[One sentence. The only prose.]"].map(function (x, i) { var a = x.split("|"); return '<div><div class="mono" style="font-size:' + fs + 'px;color:' + (i === 3 ? C.cobalt : C.graphite) + '">' + a[0] + '</div><div class="serif" style="font-size:' + fv + 'px;margin-top:6px">' + a[1] + '</div></div>'; }).join("") + '</div>' +
    '<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:' + M * .025 + 'px;margin-top:' + M * .04 + 'px"><div class="card" style="aspect-ratio:16/10"><img src="assets/' + refs[6] + '" alt=""></div><div class="card" style="aspect-ratio:4/5;align-self:end"><img src="assets/' + refs[4] + '" alt=""></div></div>';
  var csClose = el("div", "mono abs", cs, "Close ✕"); csClose.style.fontSize = Math.round(M * .013) + "px"; csClose.style.background = C.paper; csClose.style.padding = M * .01 + "px " + M * .016 + "px"; csClose.style.borderRadius = "999px";

  /* ---------- S6 the site ---------- */

  var screens = [["screen-ring-d1.jpg", "01 · Home · the ring"], ["screen-ring-d3.jpg", "02 · Work index"], ["screen-ring-d4.jpg", "03 · Case study"], ["screen-ring-d5.jpg", "04 · Case study · facts"], ["screen-moodboard.jpg", "05 · Art direction"]];
  var dW = V ? W * .88 : W * .62, dH = dW * .625, dX = V ? (W - dW) / 2 : W * .08, dY = V ? H * .2 : (H - dH) / 2 + M * .02;
  var desk = el("div", "frame abs", s6); desk.style.width = dW + "px"; desk.style.height = dH + "px";
  var deskImgs = screens.map(function (s) { var i = el("img", "abs", desk); i.src = "assets/" + s[0]; i.alt = ""; i.style.width = dW + "px"; i.style.height = dH + "px"; return i; });
  var phW = V ? W * .34 : W * .15, phH = phW * 2.05;
  var phone = el("div", "frame abs", s6); phone.style.width = phW + "px"; phone.style.height = phH + "px"; phone.style.borderRadius = phW * .12 + "px"; phone.style.border = phW * .03 + "px solid #0E0E0E";
  var phImg = el("img", "", phone); phImg.src = "assets/screen-ring-m1.jpg"; phImg.alt = "";
  var s6lab = el("div", "mono abs", s6, "[04] The site — show, don’t tell"); s6lab.style.fontSize = Math.round(M * .016) + "px"; s6lab.style.color = C.paper;

  var s6big = el("div", "cond abs", s6, "Work first"); s6big.style.fontSize = M * (V ? .16 : .2) + "px"; s6big.style.color = C.paper;

  /* ---------- S7 end ---------- */

  var endL = el("div", "cond abs", s7, "Seri"), endR = el("div", "cond abs", s7, "us Play");
  var eFs = M * (V ? .155 : .24); endL.style.fontSize = endR.style.fontSize = eFs + "px";
  var oR = eFs * .28, oCards = refs.map(function (r) { return card(r, s7, eFs * .13); });
  var endT = el("div", "serif abs", s7, "<i>Show, don’t tell.</i>"); endT.style.fontSize = M * .06 + "px";
  var endM = el("div", "mono abs", s7, "Website direction · seriousplaystudio.com · 2026"); endM.style.fontSize = Math.round(M * .015) + "px"; endM.style.color = C.graphite;
  var fadeBlack = el("div", "abs", stage); fadeBlack.style.width = W + "px"; fadeBlack.style.height = H + "px"; fadeBlack.style.background = C.black; fadeBlack.style.zIndex = 60;

  function measure() { lw = letters.map(function (e) { return [e.offsetWidth, e.offsetHeight]; }); }

  /* ---------- render(t) ---------- */
  function show(id, t) { var r = S[id], on = t >= r[0] && t < r[1]; document.getElementById(id).style.display = on ? "block" : "none"; return on; }
  function wc(e) { return [e.offsetWidth, e.offsetHeight]; }

  window.render = function (t) {
    var bg = C.paper, dark = false;
    // HUD
    var sec = Math.floor(t), fr = Math.floor((t - sec) * 25);

    var cur = "s1"; for (var k in S) if (t >= S[k][0]) cur = k;
    hudB.textContent = "[" + cur.slice(1) + "/7] " + names[cur];

      var toRing = io(p(t, 10.8, 12.9)), spin = p(t, 10.8, 14.4) * 50 + io(p(t, 10.8, 12.9)) * 20;
      var R2 = M * .34, sR = .36;
      var x1 = cx - line1 / 2, x2 = cx - line2 / 2;
      for (i = 0; i < 11; i++) {
        var e = letters[i], lwid = lw[i][0], lh = lw[i][1];
        var sx, sy, appear;

      }

      ringLine.style.width = ringLine.style.height = R2 * 2 + "px"; tf(ringLine, cx - R2, cy - R2, 0, lerp(.6, 1, toRing), toRing * .9);

    }

    /* S3 */
    if (show("s3", t)) {

      var N5 = s5cards.length, activeIdx = ((Math.round(ang / step5) % N5) + N5) % N5;
      var grow = io(p(t, 43.2, 44.6));

      tf(capF, M * .035, H - M * .07, 0, 1, 1 - grow);

      tf(cnt, W - M * .035 - cnt.offsetWidth, H - M * .12, 0, 1, 1 - grow);

      if (grow > 0) {

        var HW = V ? W : H * .8, HX = V ? 0 : W - HW, HH = V ? H * .62 : H;

      phImg.style.transform = "translateY(" + (-io(p(t, 55, 58)) * phH * .2) + "px)"; phImg.style.width = "100%"; phImg.style.height = "120%"; phImg.style.objectFit = "cover";

      var ex = (W - total) / 2, ey = H / 2 - endL.offsetHeight / 2 - (V ? M * .05 : M * .04);

      });
      var tw = endT.offsetWidth; tf(endT, (W - tw) / 2, ey + endL.offsetHeight + M * .05, 0, 1, p(t, 64.8, 65.8));
      var mw = endM.offsetWidth; tf(endM, (W - mw) / 2, ey + endL.offsetHeight + M * .15, 0, 1, p(t, 66, 66.8));
    }

    fadeBlack.style.opacity = (Math.max(1 - p(t, 0, .3) * 0, 0) * 0 + p(t, 70.2, 72)).toFixed(3);
    stage.style.background = bg;
    var ink = dark ? C.paper : C.ink;
    hudL.style.color = hudR.style.color = hudB.style.color = ink;
    hudL.style.opacity = hudR.style.opacity = hudB.style.opacity = (t < 1 ? p(t, .2, 1) : 1) * (1 - p(t, 62.4, 63)) * .75;
    g.style.transform = "translate(" + (-(rnd(Math.floor(t * 12)) * 256)).toFixed(0) + "px," + (-(rnd(Math.floor(t * 12) + 5) * 256)).toFixed(0) + "px)";
  };

  function hex(c) { return [1, 3, 5].map(function (i) { return parseInt(c.slice(i, i + 2), 16); }); }
  function mix(a, b, x) { var A = hex(a), B = hex(b); return "rgb(" + A.map(function (v, i) { return Math.round(lerp(v, B[i], x)); }).join(",") + ")"; }
