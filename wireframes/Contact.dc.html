<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:"Archivo","Helvetica Neue",sans-serif;color:#F3F2EE;background:#0E0E0E}
a{color:#F3F2EE;text-decoration:none}a:hover{color:#9FA7FF}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; background: #0E0E0E; color: #F3F2EE; display: flex; flex-direction: column">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 28px 40px; font-size: 12px; letter-spacing: 0.02em; text-transform: uppercase">
    <a href="Home.dc.html" style="font-weight: 700">Serious Play</a>
    <nav style="display: flex; gap: 24px"><a href="WorkIndex.dc.html">Work</a><a href="Studio.dc.html">Studio</a><a href="Services.dc.html">Services</a><a href="Lab.dc.html">Lab</a><a href="Contact.dc.html" style="border-bottom: 1px solid #F3F2EE">Contact</a></nav>
  </header>
  <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; padding: 40px 40px; flex-grow: 1">
    <div style="grid-column: 1 / span 6; display: flex; flex-direction: column; justify-content: space-between">
      <h1 style="margin: 0; font-size: 170px; line-height: 0.8; font-weight: 800; font-stretch: 62%; text-transform: uppercase">Start a project</h1>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <span style="font-family: 'Instrument Serif', serif; font-size: 36px">info@seriousplaystudio.com</span>
        <span style="font-family: 'Instrument Serif', serif; font-size: 36px">@seriousplaystudio ↗</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: #BEBDB8">[City] · local time [14:32]</span>
      </div>
    </div>
    <form style="grid-column: 8 / span 5; display: flex; flex-direction: column; gap: 28px; align-self: end">
      <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: #BEBDB8">Name<input type="text" placeholder="Your name" style="background: none; border: 0; border-bottom: 1px solid #5E5D59; padding: 10px 0; color: #F3F2EE; font: 400 22px 'Archivo', sans-serif"></label>
      <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: #BEBDB8">Email<input type="email" placeholder="you@brand.com" style="background: none; border: 0; border-bottom: 1px solid #5E5D59; padding: 10px 0; color: #F3F2EE; font: 400 22px 'Archivo', sans-serif"></label>
      <div style="display: flex; flex-direction: column; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: #BEBDB8"><span>What do you need?</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px"><span style="padding: 8px 12px; border: 1px solid #F3F2EE; color: #F3F2EE">Identity</span><span style="padding: 8px 12px; border: 1px solid #5E5D59">Packaging</span><span style="padding: 8px 12px; border: 1px solid #5E5D59">Digital</span><span style="padding: 8px 12px; border: 1px solid #5E5D59">Campaign</span><span style="padding: 8px 12px; border: 1px solid #5E5D59">Not sure yet</span></div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: #BEBDB8">Tell us about it<textarea rows="3" placeholder="Brand, timing, budget range" style="background: none; border: 0; border-bottom: 1px solid #5E5D59; padding: 10px 0; color: #F3F2EE; font: 400 20px 'Archivo', sans-serif; resize: none"></textarea></label>
      <button type="button" style="align-self: flex-start; padding: 16px 24px; border: 0; background: #F3F2EE; color: #0E0E0E; font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em">Send brief →</button>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>

  renderVals() { return {}; }

</script>
</body>
</html>
